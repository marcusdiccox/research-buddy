name: Check Research Buddy
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e
      - run: npm run make
      - uses: actions/upload-artifact@v4
        with:
          name: research-buddy-windows
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-diagnostics
          path: test-results/
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: research-buddy-windows
          path: release
      - name: Publish tested installer and update metadata
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = $env:GITHUB_REF_NAME
          if ($tag -ne "v$version") { throw 'Release tag must match package.json version.' }
          gh release view $tag --json isDraft --jq .isDraft *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Output 'Release already exists; preserving its assets.'
            exit 0
          }
          $files = @("release/Pip-Setup-$version.exe", "release/Pip-Setup-$version.exe.blockmap", 'release/latest.yml')
          foreach ($file in $files) {
            if (!(Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing release asset: $file" }
          }
          $notes = "docs/releases/$tag.md"
          if (Test-Path -LiteralPath $notes -PathType Leaf) {
            gh release create $tag @files --verify-tag --title "Pip $version" --notes-file $notes --latest
          } else {
            gh release create $tag @files --verify-tag --title "Pip $version" --generate-notes --latest
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
